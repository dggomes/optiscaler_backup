name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate stable version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use a stable vMAJOR.MINOR.PATCH tag' }
          "RELEASE_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and test
        run: npm run agent:pre-commit
      - name: Publish
        shell: pwsh
        run: dotnet publish src/cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:RELEASE_VERSION -o artifacts/win-x64
      - name: Test executable updater
        shell: pwsh
        run: ./scripts/test-updater.ps1 -Executable artifacts/win-x64/optibackup.exe
      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item artifacts/win-x64/optibackup.exe artifacts/optibackup-win-x64.exe
          $hash = (Get-FileHash artifacts/optibackup-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  optibackup-win-x64.exe" | Set-Content artifacts/optibackup-win-x64.exe.sha256 -Encoding ascii
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: PATH="/usr/bin:$PATH" gh release create "$GITHUB_REF_NAME" artifacts/optibackup-win-x64.exe artifacts/optibackup-win-x64.exe.sha256 --verify-tag --generate-notes
