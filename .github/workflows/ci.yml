name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Repository checks
        run: npm run agent:pre-commit
      - name: Publish Windows executable
        if: runner.os == 'Windows'
        run: dotnet publish src/cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - name: Download previous schema release for compatibility test
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: PATH="/usr/bin:$PATH" gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" --pattern 'optibackup-win-x64.exe*' --dir artifacts/previous
      - name: Updater integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-updater.ps1 -Executable artifacts/win-x64/optibackup.exe -PreviousExecutable artifacts/previous/optibackup-win-x64.exe
      - name: Build and format desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet build src/desktop/optiscaler-backup-desktop.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format src/desktop/optiscaler-backup-desktop.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/desktop/optiscaler-backup-desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-desktop.ps1 -Executable artifacts/desktop/optibackup-ui.exe -Cli artifacts/win-x64/optibackup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && always()
        with:
          name: optibackup-desktop-preview
          path: |
            artifacts/desktop/optibackup-ui.exe
            artifacts/desktop-screenshots/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: optibackup-win-x64
          path: artifacts/win-x64/optibackup.exe
